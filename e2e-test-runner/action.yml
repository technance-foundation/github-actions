name: "E2E Test Runner"
description: "Runs Playwright E2E tests, manages setup, caching, reports, and GitHub Check Runs."

inputs:
    token:
        description: "GitHub token with permissions to update checks"
        required: true

    check-run-id:
        description: "GitHub Check Run ID"
        required: true

    project:
        description: "Project/app name (used for report folder and summary)"
        required: true

    preview-url:
        description: "Preview deployment base URL for the tests (BASE_URL)"
        required: true

    node-version:
        description: "Node.js version"
        default: "22"

    pnpm-version:
        description: "PNPM version"
        default: "10.15.0"

    playwright-version:
        description: "Playwright version (for caching)"
        default: "1.53.2"

    npm-token:
        description: "NPM token for installing private dependencies. Leave empty to skip .npmrc auth (e.g. when the project pulls only public packages)."
        required: false
        default: ""

    test-command:
        description: "Command used to run E2E tests"
        default: "pnpm run test:e2e"
        required: false

    working-directory:
        description: "Working directory where E2E tests should run"
        required: false

    shard-index:
        description: "1-based shard index when running Playwright in shard mode. When set together with shard-total, the runner appends `--shard=<index>/<total>` to the test command and uploads a Playwright blob report instead of an html report."
        required: false
        default: ""

    shard-total:
        description: "Total number of shards when running Playwright in shard mode."
        required: false
        default: ""

    skip-check-completion:
        description: "If 'true', the runner does not mark the GitHub check as completed at the end of the job. Use this when a downstream merge job is responsible for completing the check (e.g. after merging blob reports from multiple shards)."
        required: false
        default: "false"

    pnpm-cache:
        description: "pnpm-store cache strategy. `write` (default) restores and saves; `read` restores only — set this on shards that follow an `e2e-bootstrap` job so they don't waste post-job time re-tarring the same store; `off` disables the cache entirely."
        required: false
        default: "write"

    playwright-cache:
        description: "Playwright browser cache strategy. `write` (default) restores and saves; `read` restores only — set this on shards that follow an `e2e-bootstrap` job so they don't waste post-job time re-tarring the browser cache."
        required: false
        default: "write"
runs:
    using: composite
    steps:
        # =========================================================
        # Check out action source WITHOUT wiping caller repo
        # =========================================================
        - name: Checkout action source
          id: checkout-action
          uses: actions/checkout@v6
          with:
              repository: technance-foundation/github-actions
              ref: main
              path: ./.github/actions/github-actions
              sparse-checkout: |
                  e2e-check
                  e2e-test-runner
              sparse-checkout-cone-mode: false

        # -----------------------------------------------------
        # MARK CHECK AS IN_PROGRESS
        # -----------------------------------------------------
        # Note: when sharded, every shard hits this with the same check
        # run id and state=in_progress. PATCH /check-runs is idempotent
        # for repeated identical state transitions, so the redundant
        # calls are safe.
        - name: Mark check as in_progress
          id: mark-in-progress
          uses: technance-foundation/github-actions/e2e-check@main
          with:
              token: ${{ inputs.token }}
              check-run-id: ${{ inputs.check-run-id }}
              state: in_progress

        # -----------------------------------------------------
        # SETUP & DEPENDENCIES
        # -----------------------------------------------------
        - name: Setup & install (root)
          id: setup
          uses: technance-foundation/github-actions/setup@main
          with:
              node-version: ${{ inputs.node-version }}
              pnpm-version: ${{ inputs.pnpm-version }}
              npm-token: ${{ inputs.npm-token }}
              pnpm-cache: ${{ inputs.pnpm-cache }}
              install: "pnpm install --no-frozen-lockfile"
              build: "false"

        # -----------------------------------------------------
        # BROWSER CACHING
        # -----------------------------------------------------
        # Two conditional cache steps: `actions/cache@v5` (read +
        # write — default) vs `actions/cache/restore@v4` (read
        # only). The downstream `cache-playwright` step normalizes
        # the `cache-hit` output so the install-on-miss step and
        # the final `Complete check` job-status expression don't
        # need to branch on which one ran.
        - name: Cache Playwright browsers (read + write)
          id: cache-playwright-rw
          if: inputs.playwright-cache != 'read'
          uses: actions/cache@v5
          with:
              path: ~/.cache/ms-playwright
              key: ${{ runner.os }}-playwright-${{ inputs.playwright-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-playwright-${{ inputs.playwright-version }}-

        - name: Cache Playwright browsers (restore only)
          id: cache-playwright-ro
          if: inputs.playwright-cache == 'read'
          uses: actions/cache/restore@v4
          with:
              path: ~/.cache/ms-playwright
              key: ${{ runner.os }}-playwright-${{ inputs.playwright-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}
              restore-keys: |
                  ${{ runner.os }}-playwright-${{ inputs.playwright-version }}-

        - name: Normalize Playwright cache-hit
          id: cache-playwright
          shell: bash
          env:
              HIT_RW: ${{ steps.cache-playwright-rw.outputs.cache-hit }}
              HIT_RO: ${{ steps.cache-playwright-ro.outputs.cache-hit }}
          run: |
              if [ "$HIT_RW" = "true" ] || [ "$HIT_RO" = "true" ]; then
                  echo "cache-hit=true" >> "$GITHUB_OUTPUT"
              else
                  echo "cache-hit=false" >> "$GITHUB_OUTPUT"
              fi

        - name: Install Playwright deps + browsers (cache miss)
          id: pw-install
          if: steps.cache-playwright.outputs.cache-hit != 'true'
          shell: bash
          run: pnpm exec playwright install --with-deps chromium

        # -----------------------------------------------------
        # RUN TESTS
        # -----------------------------------------------------
        - name: Run E2E tests
          id: e2e
          shell: bash
          working-directory: ${{ inputs.working-directory != '' && inputs.working-directory || format('apps/{0}', inputs.project) }}
          env:
              BASE_URL: ${{ inputs.preview-url }}
              SHARD_INDEX: ${{ inputs.shard-index }}
              SHARD_TOTAL: ${{ inputs.shard-total }}
              TEST_COMMAND: ${{ inputs.test-command }}
          run: |
              if [ -n "$SHARD_INDEX" ] && [ -n "$SHARD_TOTAL" ]; then
                  echo "Running shard $SHARD_INDEX/$SHARD_TOTAL"
                  eval "$TEST_COMMAND" -- --shard="$SHARD_INDEX/$SHARD_TOTAL"
              else
                  eval "$TEST_COMMAND"
              fi

        # -----------------------------------------------------
        # REPORT (sharded path uploads a blob report; un-sharded
        # path keeps the legacy html report)
        # -----------------------------------------------------
        - name: Upload Playwright blob report (sharded)
          id: upload-blob-report
          if: always() && inputs.shard-index != '' && inputs.shard-total != ''
          uses: actions/upload-artifact@v4
          with:
              name: ${{ inputs.project }}-playwright-blob-report-${{ inputs.shard-index }}
              path: ${{ inputs.working-directory != '' && format('{0}/blob-report/', inputs.working-directory) || format('apps/{0}/blob-report/', inputs.project) }}
              retention-days: 7
              if-no-files-found: error

        - name: Upload Playwright report (un-sharded)
          id: upload-report
          if: always() && (inputs.shard-index == '' || inputs.shard-total == '')
          uses: actions/upload-artifact@v4
          with:
              name: ${{ inputs.project }}-playwright-report
              path: ${{ inputs.working-directory != '' && format('{0}/playwright-report/', inputs.working-directory) || format('apps/{0}/playwright-report/', inputs.project) }}
              retention-days: 30

        # -----------------------------------------------------
        # COMPLETE CHECK (skipped when a downstream merge job
        # owns the final check completion)
        # -----------------------------------------------------
        - name: Complete check
          if: always() && inputs.skip-check-completion != 'true'
          uses: technance-foundation/github-actions/e2e-check@main
          with:
              token: ${{ inputs.token }}
              check-run-id: ${{ inputs.check-run-id }}
              state: completed
              job-status: ${{ (steps.checkout-action.outcome == 'success' && steps.mark-in-progress.outcome == 'success' && steps.setup.outcome == 'success' && steps.cache-playwright.outcome == 'success' && (steps.pw-install.outcome == 'success' || steps.pw-install.outcome == 'skipped') && steps.e2e.outcome == 'success' && (steps.upload-report.outcome == 'success' || steps.upload-report.outcome == 'skipped') && (steps.upload-blob-report.outcome == 'success' || steps.upload-blob-report.outcome == 'skipped')) && 'success' || 'failure' }}
              project: ${{ inputs.project }}
              preview-url: ${{ inputs.preview-url }}
